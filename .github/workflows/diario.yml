name: Video diario

on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (genera el video pero no publica)"
        type: boolean
        default: true
      turno:
        description: "Turno (vacio = segun la hora)"
        type: choice
        options: ["", "manana", "tarde"]
        default: ""

permissions:
  contents: write

concurrency:
  group: canal
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar programas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          mkdir -p assets
          mv Inter-*.otf assets/ 2>/dev/null || true

      - name: Crear y publicar el video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          TURNO: ${{ inputs.turno }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python aviacion.py --prueba
          else
            python aviacion.py
          fi

      - name: Guardar el video para revisarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-del-dia
          path: |
            salida/video.mp4
            salida/corto.mp4
            salida/miniatura.png
            salida/guion.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar por donde vamos
        if: success() && inputs.prueba != true
        run: |
          git config user.name "canal-bot"
          git config user.email "canal-bot@users.noreply.github.com"
          git add estado_aviacion.json || true
          git commit -m "Estado actualizado" || true
          git pull --rebase || true
          git push || true

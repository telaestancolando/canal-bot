name: Video diario

on:
  schedule:
    # 02:00 UTC = 03:00 en Espana en invierno (04:00 en verano)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (genera el video pero no publica)"
        type: boolean
        default: true
      modo:
        description: "Tema (vacio = segun el dia: L-X-V dinero, M-J escandalo)"
        type: choice
        options: ["", "dinero", "escandalo"]
        default: ""

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar programas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          mkdir -p assets
          mv Inter-*.otf assets/ 2>/dev/null || true

      - name: Crear y publicar el video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python bot.py --prueba
          else
            python bot.py
          fi

      - name: Guardar el video para revisarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-del-dia
          path: |
            salida/video.mp4
            salida/corto.mp4
            salida/miniatura.png
            salida/guion.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar historial de temas
        if: success() && inputs.prueba != true
        run: |
          git config user.name "canal-bot"
          git config user.email "canal-bot@users.noreply.github.com"
          git add historial.json || true
          git commit -m "Historial actualizado" || true
          git push || true
